[project]
name = "novelpilot"
version = "0.1.0"
description = "Local fact-routed Agent Loop Harness for fully automatic long-form novel writing."
requires-python = ">=3.13"
dependencies = [
  "aiosqlite==0.22.1",
  "fastapi>=0.139.0",
  # Pydantic AI 2.15.0 cannot consume the usage fields introduced in genai-prices 0.1.
  "genai-prices==0.0.73",
  "httpx==0.28.1",
  "httpx2>=2.9.0,<3.0.0",
  "openai>=2.46.0,<3.0.0",
  "pydantic>=2.13.0",
  "pydantic-ai-slim[anthropic,openai]==2.15.0",
  "uvicorn>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19.0",
  "pytest>=9.1.0",
  "ruff>=0.14.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
  "synthetic_integration: deterministic integration evidence that does not use a real Provider",
  "real_model: paid tests that call the configured real model Provider",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "backend"
exclude = ["backend/tests/"]
